architectures:
  # Baselines (Huber default)
  gru_512x256_huber_d05:
    model: { type: GRU, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.25, l2: 2e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

  lstm_512x256_huber_d05:
    model: { type: LSTM, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.25, l2: 2e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

  gru_512x256x128_huber_d05:
    model: { type: GRU, input_dim: 33, horizon: 61, hidden_units: [512, 256, 128], dropout: 0.30, l2: 5e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

  lstm_512x256x128_huber_d05:
    model: { type: LSTM, input_dim: 33, horizon: 61, hidden_units: [512, 256, 128], dropout: 0.30, l2: 5e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

  # Bigger / deeper networks
  gru_1024x512_huber_d05:
    model: { type: GRU, input_dim: 33, horizon: 61, hidden_units: [1024, 512], dropout: 0.25, l2: 2e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.0008, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

  lstm_1024x512_huber_d05:
    model: { type: LSTM, input_dim: 33, horizon: 61, hidden_units: [1024, 512], dropout: 0.25, l2: 2e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.0008, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

  gru_1024x512x256_huber_d05:
    model: { type: GRU, input_dim: 33, horizon: 61, hidden_units: [1024, 512, 256], dropout: 0.30, l2: 5e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.0007, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

  lstm_1024x512x256_huber_d05:
    model: { type: LSTM, input_dim: 33, horizon: 61, hidden_units: [1024, 512, 256], dropout: 0.30, l2: 5e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.0007, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

  gru_512x512x256x128_huber_d05:
    model: { type: GRU, input_dim: 33, horizon: 61, hidden_units: [512, 512, 256, 128], dropout: 0.35, l2: 8e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.0006, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

  lstm_512x512x256x128_huber_d05:
    model: { type: LSTM, input_dim: 33, horizon: 61, hidden_units: [512, 512, 256, 128], dropout: 0.35, l2: 8e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.0006, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

  # Loss variants (same arch, different objectives)
  # Useful because your plot suggests "mean-seeking" / peak underestimation
  gru_512x256_mae:
    model: { type: GRU, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.25, l2: 2e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: mae }

  gru_512x256_mse:
    model: { type: GRU, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.25, l2: 2e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: mse }

  gru_512x256_huber_d02:
    model: { type: GRU, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.25, l2: 2e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: { name: huber, delta: 0.02 } }

  gru_512x256_huber_d10:
    model: { type: GRU, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.25, l2: 2e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: { name: huber, delta: 0.10 } }

  gru_512x256_wmse_a2:
    model: { type: GRU, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.25, l2: 2e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: { name: weighted_mse, alpha: 2.0 } }

  gru_512x256_wmse_a5:
    model: { type: GRU, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.25, l2: 2e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: { name: weighted_mse, alpha: 5.0 } }

  lstm_512x256_mae:
    model: { type: LSTM, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.25, l2: 2e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: mae }

  lstm_512x256_huber_d10:
    model: { type: LSTM, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.25, l2: 2e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: { name: huber, delta: 0.10 } }

  lstm_512x256_wmse_a5:
    model: { type: LSTM, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.25, l2: 2e-5, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: { name: weighted_mse, alpha: 5.0 } }

  # Regularization / stability sweeps (same size, different dropout/L2)
  gru_512x256_drop10_l2e6:
    model: { type: GRU, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.10, l2: 1e-6, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

  gru_512x256_drop35_l2e4:
    model: { type: GRU, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.35, l2: 1e-4, layer_norm: true, output_activation: null }
    training: { lr: 0.0008, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

  lstm_512x256_drop10_l2e6:
    model: { type: LSTM, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.10, l2: 1e-6, layer_norm: true, output_activation: null }
    training: { lr: 0.001, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

  lstm_512x256_drop35_l2e4:
    model: { type: LSTM, input_dim: 33, horizon: 61, hidden_units: [512, 256], dropout: 0.35, l2: 1e-4, layer_norm: true, output_activation: null }
    training: { lr: 0.0008, clipnorm: 1.0, loss: { name: huber, delta: 0.05 } }

defaults:
  fit:
    epochs: 200
    batch_size: 128
    callbacks:
      - name: EarlyStopping
        monitor: val_loss
        patience: 20
        min_delta: 1e-4
        restore_best_weights: true
      - name: ReduceLROnPlateau
        monitor: val_loss
        factor: 0.5
        patience: 5
        min_lr: 1e-5
